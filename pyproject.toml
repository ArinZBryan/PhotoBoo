[project]
name = "PhotoBoo"
version = "0.0.1"
dependencies = [
    "glfw>=2.11.0",
    "numpy>=1.24.4",
    "opencv-python>=4.8.0",
    "pyopengl>=3.1.10",
    "slimgui",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "opencv-python",
    "mediapipe",
    "slimgui"
]
requires-python = ">=3.8"
authors = [
    {name = "Arin Bryan", email = "arinbryan27@gmail.com"},
    {name = "Luke Plastow"},
    {name = "Onkar Garg", email = "onkargarg6@gmail.com"}
]
description = "The haunted-house mirror from hell"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]


[project.scripts]
photoboo = "PhotoBoo.app:run"
photoboo-web = "PhotoBoo.web:run"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PhotoBoo"
